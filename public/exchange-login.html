<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود صرافان | یاور ۳۶۵</title>

    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/faq">FAQ</a>
            <a href="/apps">Apps</a>
            <a href="/login">Login</a>
            <a href="/exchange-login">صرافان</a>
        </div>

        <div class="nav-actions">
            <button id="themeButton" class="theme-button">☾</button>

            <select id="languageSelect" class="language-select">
                <option value="dari">دری</option>
                <option value="farsi">فارسی</option>
                <option value="tajik">тоҷикӣ</option>
                <option value="turkish">Türkçe</option>
                <option value="arabic-iq">العربية - العراق</option>
                <option value="arabic-ae">العربية - الإمارات</option>
                <option value="english">English</option>
                <option value="urdu">اردو</option>
            </select>
        </div>
    </nav>

    <main class="exchange-page">

        <form id="exchangeForm" class="exchange-form">

            <h2>ورود صرافان همکار</h2>

            <input
                type="text"
                placeholder="نام کاربری"
                required
            >

            <input
                type="password"
                placeholder="گذرواژه"
                required
            >

            <div id="errorMessage" class="error-message">
                نام کاربری یا گذرواژه شما اشتباه است
            </div>

            <div class="form-buttons">

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="history.back()"
                >
                    بازگشت
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    تایید
                </button>

            </div>

        </form>

    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/language.js"></script>
    <script src="/js/exchange-login.js"></script>

</body>
</html>
